$('#lookupBtn').onclick=async()=>{const q=$('#form').elements.title.value.trim(),b=$('#lookupBtn'),box=$('#matches');if(!q){toast('先输入书名或片名');return}b.disabled=true;b.textContent='查找中…';box.innerHTML='';try{let rows=[];if(tab==='books'){const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('intitle:'+q)+'&maxResults=6');const j=await r.json();rows=(j.items||[]).map(v=>{const z=v.volumeInfo||{},n=Math.max(1,Math.min(5,Math.round(z.averageRating||0)));return{title:z.title||'',creator:(z.authors||[]).join(', '),image:(z.imageLinks?.thumbnail||'').replace('http:','https:'),tags:(z.categories||[]).join(', '),rating:z.averageRating?'★'.repeat(n)+'☆'.repeat(5-n):'',score:z.averageRating?'Google Books '+z.averageRating+'/5 ('+(z.ratingsCount||0)+' ratings)':'',info:[z.publishedDate,z.publisher].filter(Boolean).join(' · '),source:'Google Books'}})}else{const r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=movie&limit=8&country=US');const j=await r.json();rows=(j.results||[]).map(z=>({title:z.trackName||'',creator:z.artistName||'',image:(z.artworkUrl600||z.artworkUrl100||'').replace('100x100','600x600'),tags:z.primaryGenreName||'',rating:'',score:z.averageUserRating?'Apple users '+z.averageUserRating+'/5 ('+(z.userRatingCount||0)+' ratings)':'',info:(z.releaseDate||'').slice(0,4),source:'Apple TV'}))}if(!rows.length){box.innerHTML='<small class="hint">没有找到匹配项，可以手动填写。</small>';return}box.innerHTML=rows.map((z,i)=>'<button type="button" class="match" data-match="'+i+'">'+(z.image?'<img src="'+esc(z.image)+'" alt="">':'')+'<span>'+esc(z.title)+'<small>'+esc([z.creator,z.info,z.source].filter(Boolean).join(' · '))+'</small></span></button>').join('');box.querySelectorAll('[data-match]').forEach(btn=>btn.onclick=async()=>{const z=rows[Number(btn.dataset.match)],f=$('#form');f.elements.title.value=z.title;f.elements.creator.value=z.creator;f.elements.image.value=z.image;f.elements.tags.value=z.tags;if(z.rating)f.elements.rating.value=z.rating;f.elements.sourceRating.value=z.score;box.innerHTML='<small class="hint">正在补充导演资料…</small>';if(tab==='movies'){const d=await findDirector(z.title);if(d)f.elements.creator.value=d}box.innerHTML='<small class="hint">已填入资料，来源：'+esc(z.source)+(f.elements.creator.value?'；导演 / 作者已匹配':'；导演 / 作者暂无可靠匹配')+'。观看 / 阅读年月由你填写；外部评分与个人评分分开保存。</small>'})}catch(e){box.innerHTML='<small class="hint">暂时无法连接资料库。确认网络后重试，或手动填写。浏览器可能限制本地文件联网。</small>'}finally{b.disabled=false;b.textContent='⌕ 自动查找'}};
$('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='帧间档案备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.books)||!Array.isArray(d.movies))throw Error();data=d;save();toast('备份已导入')}catch{toast('文件格式不正确')}};r.readAsText(f)};render();
</script></body></html>
